<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#180b2c"><title>老婆大人，请查收哄好申请</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow:hidden}body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#fff;background:#120822}button{font:inherit;-webkit-tap-highlight-color:transparent}
.sky{position:fixed;inset:0;background:radial-gradient(circle at 18% 18%,#702a87 0,transparent 30%),radial-gradient(circle at 82% 78%,#c52f67 0,transparent 34%),linear-gradient(145deg,#10071e,#341044 52%,#17091f);overflow:hidden}
.sky:after{content:"";position:absolute;inset:0;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:31px 31px;opacity:.24;animation:drift 18s linear infinite}
.glow{position:absolute;width:320px;height:320px;border-radius:50%;filter:blur(75px);opacity:.3;animation:float 8s ease-in-out infinite}.g1{background:#ff4d9d;left:-130px;top:20%}.g2{background:#975cff;right:-120px;bottom:10%;animation-delay:-3s}
.wrap{position:relative;z-index:3;min-height:100svh;display:grid;place-items:center;padding:20px}
.card{position:relative;width:min(92vw,440px);min-height:590px;padding:46px 28px 38px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:1px solid rgba(255,255,255,.24);border-radius:38px;background:linear-gradient(145deg,rgba(255,255,255,.18),rgba(255,255,255,.07));backdrop-filter:blur(22px);box-shadow:0 35px 110px rgba(0,0,0,.42),inset 0 1px rgba(255,255,255,.35)}
.crown{font-size:42px;filter:drop-shadow(0 8px 15px rgba(255,190,70,.38));animation:bob 2.3s ease-in-out infinite}.tag{margin:12px 0 18px;color:#f7bdd7;font-size:11px;font-weight:800;letter-spacing:.28em}.card h1{margin:0;font-size:clamp(37px,10vw,53px);line-height:1.12;letter-spacing:-.05em;text-shadow:0 8px 30px rgba(0,0,0,.24)}.card h1 span{display:block;margin-top:8px;background:linear-gradient(90deg,#fff,#ffbed9,#e8c4ff);-webkit-background-clip:text;color:transparent}
.message{min-height:72px;margin:22px 0 24px;display:grid;place-items:center;color:#f7dce8;font-size:16px;line-height:1.7;transition:.3s}
.buttons{min-height:136px;width:100%;display:flex;align-items:center;justify-content:center;gap:16px}.buttons button{height:54px;min-width:128px;padding:0 20px;border:0;border-radius:999px;font-size:16px;font-weight:800;cursor:pointer;transition:transform .3s cubic-bezier(.2,.9,.2,1),opacity .25s}
#yes{position:relative;z-index:4;color:#84224d;background:linear-gradient(135deg,#fff,#ffd1e4);box-shadow:0 13px 35px rgba(255,92,157,.35)}#no{color:#f7dce8;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28)}
.promise{margin-top:5px;color:rgba(255,255,255,.54);font-size:11px;letter-spacing:.08em}
.orbit{position:absolute;inset:13px;border:1px dashed rgba(255,255,255,.14);border-radius:30px;pointer-events:none}
.rain span{position:fixed;z-index:2;top:-30px;color:#ff77ad;font-family:serif;animation:fall linear infinite;filter:drop-shadow(0 0 8px #ff4f98)}
.final{position:relative;z-index:5;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(circle,#7c2055 0,#280b3e 44%,#0c0615 100%)}
.bigheart{font:170px/1 Georgia,serif;color:#ff629e;filter:drop-shadow(0 0 35px rgba(255,82,151,.72));animation:heartPop .8s cubic-bezier(.2,1.5,.4,1) both,pulse 1.4s .8s infinite}.final h1{margin:16px 0 9px;font-size:clamp(40px,11vw,60px);text-shadow:0 10px 35px #000}.final p{margin:0;color:#ffd6e7;font-size:18px;line-height:1.8}.final small{display:block;margin-top:17px;color:#eab7d2}.again{margin-top:26px;padding:12px 21px;border:1px solid rgba(255,255,255,.35);border-radius:999px;color:#fff;background:rgba(255,255,255,.12);cursor:pointer}
.spark{position:fixed;z-index:4;left:50%;top:50%;width:7px;height:7px;border-radius:50%;background:hsl(var(--h),95%,70%);box-shadow:0 0 12px currentColor;animation:explode 1.45s var(--d) ease-out both}
.toast{position:fixed;z-index:8;left:50%;bottom:28px;transform:translateX(-50%) translateY(30px);padding:12px 18px;border-radius:999px;background:rgba(20,7,32,.85);border:1px solid rgba(255,255,255,.2);opacity:0;transition:.3s;white-space:nowrap}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@keyframes drift{to{background-position:31px 31px}}@keyframes float{50%{transform:translateY(-40px) scale(1.15)}}@keyframes bob{50%{transform:translateY(-7px) rotate(4deg)}}@keyframes pulse{50%{transform:scale(1.1)}}@keyframes heartPop{0%{transform:scale(.1) rotate(-18deg);opacity:0}75%{transform:scale(1.18) rotate(5deg)}100%{transform:scale(1);opacity:1}}@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}@keyframes explode{0%{transform:translate(-50%,-50%) rotate(var(--a)) translateX(0);opacity:1}100%{transform:translate(-50%,-50%) rotate(var(--a)) translateX(var(--r));opacity:0}}
@media(max-width:420px){.wrap{padding:13px}.card{min-height:min(610px,94svh);padding:38px 18px 30px;border-radius:31px}.buttons{gap:10px}.buttons button{min-width:112px;padding-inline:14px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style></head><body>
<div class="sky"><i class="glow g1"></i><i class="glow g2"></i></div><div class="rain" id="rain"></div>
<main class="wrap" id="app"><section class="card"><i class="orbit"></i><div class="crown">👑</div><p class="tag">SPECIAL FOR MY QUEEN</p><h1>老婆大人<span>请查收哄好申请</span></h1><div class="message" id="msg">老公已经认真反省了<br>现在申请换老婆一个笑脸，好不好？</div><div class="buttons"><button id="yes">原谅老公</button><button id="no">还没消气</button></div><p class="promise">有效期：一辈子 · 最终解释权归老婆所有</p></section></main><div class="toast" id="toast"></div>
<script>
const lines=["收到！先送老婆一个云抱抱 🤗","老婆说得都对，老公继续反省！","今天的奶茶和亲亲都归老婆 💗","再给老公一次表现机会嘛～","不同意按钮已经被老婆的可爱融化了！"];let n=0;
const yes=document.querySelector("#yes"),no=document.querySelector("#no"),msg=document.querySelector("#msg"),toast=document.querySelector("#toast"),app=document.querySelector("#app");
for(let i=0;i<26;i++){const s=document.createElement("span");s.textContent=i%3?"♥":"✦";s.style.left=Math.random()*100+"vw";s.style.animationDuration=5+Math.random()*6+"s";s.style.animationDelay=-Math.random()*8+"s";s.style.fontSize=12+Math.random()*18+"px";document.querySelector("#rain").appendChild(s)}
no.onclick=()=>{n=Math.min(n+1,5);msg.innerHTML=lines[n-1];yes.style.transform=`scale(${1+n*.23})`;no.style.transform=`scale(${Math.max(.5,1-n*.1)}) translate(${n%2?14:-12}px,${n*4}px)`;no.style.opacity=Math.max(.45,1-n*.09);toast.textContent=n<5?"老公正在加倍努力哄老婆…":"老婆最可爱，不接受反驳！";toast.classList.add("show");setTimeout(()=>toast.classList.remove("show"),1200)}
yes.onclick=()=>{let sparks="";for(let i=0;i<75;i++)sparks+=`<i class="spark" style="--a:${i*137.5}deg;--r:${130+i%7*28}px;--d:${i%9*.035}s;--h:${320+i%6*12}"></i>`;app.outerHTML=`<main class="final">${sparks}<div class="bigheart">♥</div><h1>老婆终于笑啦！</h1><p>老公最喜欢老婆了<br>以后每天都要负责把老婆哄开心</p><small>老婆一笑，世界都变甜了 ✨</small><button class="again" onclick="location.reload()">再哄一次</button></main>`}
</script></body></html>
